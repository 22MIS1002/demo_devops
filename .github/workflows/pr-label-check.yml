name: PR Label Check

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: number
      repo:
        description: 'Source repository name'
        required: true
        type: string
      owner:
        description: 'Source repository owner'
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-label:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            // ─────────────────────────────────────────────────────────────
            // 1. Get source repository information
            // ─────────────────────────────────────────────────────────────

            const owner = '${{ inputs.owner }}';
            const repo = '${{ inputs.repo }}';
            const prNumber = ${{ inputs.pr_number }};

            core.info(`Source repository: ${owner}/${repo}`);
            core.info(`PR number: ${prNumber}`);


            // ─────────────────────────────────────────────────────────────
            // 2. Get the actual PR from the source repository
            // ─────────────────────────────────────────────────────────────

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            core.info(`PR title: ${pr.title}`);
            core.info(`PR URL: ${pr.html_url}`);


            // ─────────────────────────────────────────────────────────────
            // 3. Get current PR labels
            // ─────────────────────────────────────────────────────────────

            const prLabels = pr.labels.map(
              label => label.name.toLowerCase()
            );

            core.info(
              `Labels on PR: ${JSON.stringify(prLabels)}`
            );


            // ─────────────────────────────────────────────────────────────
            // 4. Check if bug or enhancement label is present
            // ─────────────────────────────────────────────────────────────

            const CORE_LABELS = [
              'bug',
              'enhancement',
              'merge'
            ];

            // Count how many core labels are present
            const coreLabelsFound = prLabels.filter(
              label => CORE_LABELS.includes(label)
            );

            const hasAtLeastOneCore = coreLabelsFound.length > 0;
            const hasMultipleCoreLabels = coreLabelsFound.length > 1;

            core.info(
              `Core labels found: ${JSON.stringify(coreLabelsFound)}`
            );
            core.info(
              `Has at least one: ${hasAtLeastOneCore}`
            );
            core.info(
              `Has multiple: ${hasMultipleCoreLabels}`
            );


            // ─────────────────────────────────────────────────────────────
            // 5. Hidden marker for bot comment
            // ─────────────────────────────────────────────────────────────

            const MARKER =
              `<!-- pr-label-check:${prNumber} -->`;


            // ─────────────────────────────────────────────────────────────
            // 6. Find existing bot comment
            // ─────────────────────────────────────────────────────────────

            async function findBotComment() {

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: prNumber,
                  per_page: 100
                }
              );

              return comments.find(
                comment =>
                  comment.user.login === 'github-actions[bot]' &&
                  comment.body &&
                  comment.body.includes(MARKER)
              ) || null;
            }


            // ─────────────────────────────────────────────────────────────
            // 7. Create or update bot comment
            // ─────────────────────────────────────────────────────────────

            async function upsertBotComment(body) {

              const fullBody =
                `${body.trim()}\n\n${MARKER}`;

              const existing = await findBotComment();

              if (!existing) {

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: fullBody
                });

                core.info(
                  'Created bot comment'
                );

              } else if (existing.body !== fullBody) {

                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: fullBody
                });

                core.info(
                  `Updated bot comment ${existing.id}`
                );

              } else {

                core.info(
                  'Bot comment unchanged - skipping update'
                );
              }
            }


            // ─────────────────────────────────────────────────────────────
            // 8. Delete bot comment
            // ─────────────────────────────────────────────────────────────

            async function deleteBotComment() {

              const existing = await findBotComment();

              if (existing) {

                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existing.id
                });

                core.info(
                  `Deleted bot comment ${existing.id}`
                );

              } else {

                core.info(
                  'No existing bot comment found'
                );
              }
            }


            // ─────────────────────────────────────────────────────────────
            // 9. Reminder when no core label exists
            // ─────────────────────────────────────────────────────────────

            const MISSING_LABEL_BODY = [
              '## ⚠️ Missing: PR Classification Label',
              '',
              'This PR cannot be merged until one of the following labels is added: `bug`, `enhancement`, or `merge`.',
              '',
              '**How to add a label:**',
              '',
              '> Go to the **Labels** section on the right panel of this PR → click and select a label.',
              '',
              '**You must add one of the following:**',
              '',
              '| Label | Use When |',
              '|---|---|',
              '| `bug` | You are fixing something that is broken |',
              '| `enhancement` | You are adding a new feature or improvement |',
              '| `merge` | Ready to merge the PR |',
              '',
              '> ℹ️ After adding one of these labels, you can also add other labels like `question`, `documentation`, `high-priority`, `in-progress`, `refactor` etc. based on your requirement.'
            ].join('\n');

            // ─────────────────────────────────────────────────────────────
            // 10. Reminder when both core labels exist
            // ─────────────────────────────────────────────────────────────
            
            const MULTIPLE_CORE_LABELS_BODY = [
              '## ⚠️ Too Many Core Labels: Please Select Only One',
              '',
              `You have added multiple core labels: ${coreLabelsFound.map(l => '`' + l + '`').join(', ')}. Please keep only one.`,
              '',
              '| Label | Use When |',
              '|---|---|',
              '| `bug` | You are fixing something that is broken |',
              '| `enhancement` | You are adding a new feature or improvement |',
              '| `merge` | Ready to merge the PR |',
              '',
              '**Steps to fix:**',
              '1. Go to the **Labels** section on the right panel of this PR',
              '2. Remove all but one of the core labels (`bug`, `enhancement`, `merge`)',
              '3. You can keep other labels like `question`, `documentation`, `high-priority`, etc.',
              '',
              '> ℹ️ A PR can have only ONE classification label, but unlimited other labels.'
            ].join('\n');


            // ─────────────────────────────────────────────────────────────
            // 11. Apply label validation
            // ─────────────────────────────────────────────────────────────

            if (hasMultipleCoreLabels) {

              core.info(
                `Multiple core labels found (${coreLabelsFound.join(', ')}) - failing check`
              );

              await upsertBotComment(
                MULTIPLE_CORE_LABELS_BODY
              );

              core.setFailed(
                `❌ Multiple core labels found: ${coreLabelsFound.join(', ')}. ` +
                'Please keep only one of: bug, enhancement, merge.'
              );

            } else if (!hasAtLeastOneCore) {

              core.info(
                'No core label found on PR - failing check'
              );

              await upsertBotComment(
                MISSING_LABEL_BODY
              );

              core.setFailed(
                '❌ This PR is missing a required label. ' +
                'Please add one of: bug, enhancement, or merge.'
              );

            } else {

              core.info(
                `Core label found on PR (${coreLabelsFound[0]}) - check passed`
              );

              await deleteBotComment();

              core.info(
                '✅ PR Label Check passed'
              );
            }
